pull_request_rules:
  - name: label changes from community
    conditions:
      - author≠@spl-maintainers
      - author≠@spl-triage
      - author≠@spl-write
      - author≠mergify[bot]
      - author≠dependabot[bot]
    actions:
      label:
        add:
          - community
  - name: automatic merge (squash) on CI success
    conditions:
      - check-success=Travis CI - Pull Request
      - check-success=all_github_action_checks
      - "#status-failure=0"
      - "#status-neutral=0"
      - label=automerge
      - author≠@dont-squash-my-commits
    actions:
      merge:
        method: squash
  - name: automatic merge (rebase) on CI success
    conditions:
      - check-success=Travis CI - Pull Request
      - check-success=all_github_action_checks
      - "#status-failure=0"
      - "#status-neutral=0"
      - label=automerge
      - author=@dont-squash-my-commits
    actions:
      merge:
        method: rebase
  - name: remove automerge label on CI failure
    conditions:
      - label=automerge
      - "#status-failure!=0"
    actions:
      label:
        remove:
          - automerge
      comment:
        message: automerge label removed due to a CI failure
  - name: remove outdated reviews
    conditions:
      - base=master
    actions:
      dismiss_reviews:
        changes_requested: true
priority_rules: []
